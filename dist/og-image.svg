    </text>
    <text x="600" y="225" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" opacity="0.82">
      Premium private poker platform demo
    </text>
  </g>

  <g>
    <rect x="420" y="288" width="76" height="108" rx="12" fill="#f6f0e6" />
    <rect x="704" y="288" width="76" height="108" rx="12" fill="#f6f0e6" />
    <rect x="516" y="280" width="76" height="108" rx="12" fill="#f6f0e6" />
    <rect x="610" y="280" width="76" height="108" rx="12" fill="#f6f0e6" />
    <text x="458" y="356" font-family="Georgia, serif" font-size="34" fill="#8c1d2f" text-anchor="middle">AH</text>
    <text x="554" y="348" font-family="Georgia, serif" font-size="34" fill="#111111" text-anchor="middle">KS</text>
    <text x="648" y="348" font-family="Georgia, serif" font-size="34" fill="#111111" text-anchor="middle">QC</text>
    <text x="742" y="356" font-family="Georgia, serif" font-size="34" fill="#8c1d2f" text-anchor="middle">8D</text>
  </g>

  <g fill="#ead7b7">
    <text x="600" y="500" font-family="Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" opacity="0.88">
